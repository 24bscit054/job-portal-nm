<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobFinder Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Job<span>Finder</span></h1>
    <p>Create Your Account</p>
  </header>

  <main class="login-box">
    <h2>Register</h2>

    <form id="registerForm">
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="email" id="email" placeholder="Email Address" required>
      <input type="password" id="password" placeholder="Create Password" minlength="6" required>
      <button type="submit">Create Account</button>
    </form>

    <p id="message"></p>
    <p>Already registered? <a href="login.html">Login here</a></p>
    <p><a href="index.html">Back to Home</a></p>
  </main>

  <script>
    document.getElementById("registerForm").addEventListener("submit", function(event) {
      event.preventDefault();

      document.getElementById("message").textContent =
        "Registration page is ready! A backend is needed to create and store accounts securely.";
    });
  </script>
</body>
</html>
